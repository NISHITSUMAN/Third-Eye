[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "third-eye-science-worker"
version = "0.1.0"
description = "Bounded Sentinel-2 L2A NDVI processing worker for Third Eye"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "planetary-computer>=1.0,<2",
  "pillow>=11,<13",
  "rasterio>=1.4,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
