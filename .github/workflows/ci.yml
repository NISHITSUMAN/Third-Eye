name: Third Eye CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web tests, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  science-worker:
    name: Python science-worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: science-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: science-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  context-source-smoke:
    name: Live JRC and Copernicus raster source smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: science-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - name: Read small live windows from public context COGs
        env:
          THIRD_EYE_LIVE_CONTEXT_SMOKE: "1"
        run: python -m pytest -q tests/test_nisar_context_live.py

  live-worker-health:
    name: Live Nest science-worker readiness
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Verify worker health and NISAR workflow advertisement
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://api.krishkumar.hackclub.app/health"
          with urllib.request.urlopen(url, timeout=12) as response:
              payload = json.load(response)

          workflows = payload.get("workflows", [])
          report = {
              "ok": payload.get("ok") is True,
              "worker_running": payload.get("worker_running") is True,
              "nisar_gcov_change_available": "nisar-gcov-change" in workflows,
              "sentinel2_ndvi_available": "sentinel2-ndvi" in workflows,
              "earthdata_configured": payload.get("earthdata_configured") is True,
          }
          print(json.dumps(report, indent=2))
          if not all(report.values()):
              raise SystemExit("Live science worker is reachable but not fully NISAR-ready.")
          PY
